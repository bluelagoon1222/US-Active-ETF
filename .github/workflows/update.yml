name: Update ETF data

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 06:30 KST Tue-Sat (US evening: ARK posts)
    - cron: "0 13 * * 1-5"    # 22:00 KST Mon-Fri (US morning: prior-day files)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update.yml"
      - "scripts/build_data.py"
      - "config/etfs.json"

permissions:
  contents: write

concurrency:
  group: update-etf
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - name: Build data
        run: python scripts/build_data.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update ETF data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
